# Long-cache static assets so browsers download them ONCE and reuse from cache
# (videos, images, fonts, and content-hashed Vite build assets). Updates are
# handled by hashed filenames (build assets) or the ?v= query bump (videos).
location ~* \.(?:mp4|webm|ogg|m4v|mov|jpe?g|png|gif|svg|webp|avif|ico|woff2?|ttf|otf|eot|css|js|map)$ {
    # If it's a real static file, serve it long-cached; otherwise fall through to
    # the app (Livewire serves /livewire-*/livewire.min.js from a route, not a
    # file — 404-ing it here breaks all Livewire interactivity).
    try_files $uri /index.php$is_args$args;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
}
